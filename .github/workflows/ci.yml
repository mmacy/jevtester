name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      # setup-uv publishes exact release tags only, so it's pinned to one.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyright
      # pyproject.toml deselects the live tests, which call real targets, with -m 'not live'.
      - run: uv run pytest

  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npx eslint .
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm run build

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact release tags only, so it's pinned to one.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --only-dev
      - run: uv run --no-sync zensical build --clean
