# Forty encounter cases for comparing targets on the parley questions. The parley suite has seven cases for the
# tutorial. These add harder ones: threats and bluffs that are still parley, offers that are only implied or only
# promised, attacks disguised as talk, monsters that won't talk however politely they're asked, and words that show
# no intent. As in the parley suite, the reaction counts what the monsters see the party do, so an attack is 0.
name: parley-bench
question_set: parley
policy: parley
targets:
- clef-flash@ollama
cases:
- id: ogre-mutton
  state:
    party: Three adventurers carrying a leg of mutton
    monsters: One hungry ogre gnawing a bare bone, 30 feet away
    player_says: Big fellow, we've got a whole leg of mutton here. It's yours if you let us by.
  expected:
    intent:
      answer: parley
    bribe:
      answer: true
    reaction:
      answer: 3
      tolerance: 1
  expected_action: parley_succeeds
  tags:
  - parley
  - bribe
- id: troll-toll
  state:
